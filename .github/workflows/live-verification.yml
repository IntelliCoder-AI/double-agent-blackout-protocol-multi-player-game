name: Public multiplayer verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-verification.yml'
      - 'tests/live/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-verification.yml'
      - 'tests/live/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-multiplayer-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aegis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_POSTGRES_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/aegis_test
      BASE_URL: https://double-agent-blackout-protocol-radhe12.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Rules and persistence
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Live social security and reconnect
        id: security
        run: node tests/live/security.cjs
      - name: Complete live co-op round and rematch
        if: ${{ !cancelled() && steps.security.outcome != 'skipped' }}
        run: node tests/live/coop.cjs
