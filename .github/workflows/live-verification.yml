name: Public multiplayer verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-verification.yml'
      - 'tests/live/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-verification.yml'
      - 'tests/live/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-multiplayer-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aegis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_POSTGRES_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/aegis_test
      BASE_URL: https://double-agent-blackout-protocol-radhe12.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Rules and persistence
        run: npm test
      - name: Independent guest transport and scoped seats
        run: npm run test:network
      - name: Production build
        run: npm run build
      - name: Public API readiness
        run: |
          node -e "const pause=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{for(let n=0;n<60;n++){try{const r=await fetch(process.env.BASE_URL+'/health/ready');const v=await r.json();if(r.ok&&v.version==='b3-practice-seats'){console.log(JSON.stringify({event:'public-health',status:r.status,...v}));return;}}catch{}await pause(3000);}throw Error('Expected deployment did not become ready');})().catch(e=>{console.error(e.message);process.exitCode=1;})"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Solo practice and single-browser reviewer flow
        run: node tests/live/reviewer.cjs
      - name: Live social security and reconnect
        id: security
        run: node tests/live/security.cjs
      - name: Complete live co-op round and rematch
        if: ${{ !cancelled() && steps.security.outcome != 'skipped' }}
        run: node tests/live/coop.cjs
